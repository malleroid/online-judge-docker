name: Docker Build Check

on:
  pull_request:
    paths:
      - "docker/**"
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            images=$(find docker -name Dockerfile -printf '%h\n' | jq -Rc '[.,inputs]')
          else
            images=$(gh pr diff ${{ github.event.pull_request.number }} --name-only \
              | grep '^docker/' \
              | sed 's|^\(docker/[^/]*/[^/]*\)/.*|\1|' \
              | sort -u \
              | while read -r dir; do
                  [ -f "$dir/Dockerfile" ] && echo "$dir"
                done \
              | jq -Rc '[.,inputs]')
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
