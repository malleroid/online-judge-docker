name: Docker Build Check

on:
  pull_request:
    paths:
      - "docker/**"
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            images=$(find docker -name Dockerfile -printf '%h\n' | jq -Rc '[.,inputs]')
          else
            images=$(gh pr diff ${{ github.event.pull_request.number }} --name-only \
              | grep '^docker/' \
              | sed 's|^\(docker/[^/]*/[^/]*\)/.*|\1|' \
              | sort -u \
              | while read -r dir; do
                  [ -f "$dir/Dockerfile" ] && echo "$dir"
                done \
              | jq -Rc '[.,inputs]')
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
