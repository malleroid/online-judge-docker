name: Docker

on:
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker.yaml"
      - ".github/scripts/plan.sh"
  push:
    branches:
      - main
    paths:
      - "docker/**"
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated image dirs (e.g. docker/atcoder/go). Empty publishes all images."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  JUDGE_VERSIONS: '{"atcoder": "2025.10"}'
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: matrix
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::workflow_dispatch publishes images and must run on main (got $GITHUB_REF)"
                exit 1
              fi
              if [ -n "$INPUT_IMAGES" ]; then
                read -ra dirs <<<"$INPUT_IMAGES"
                for dir in "${dirs[@]}"; do
                  if [ ! -f "${dir%/}/Dockerfile" ]; then
                    echo "::error::No Dockerfile in '$dir'"
                    exit 1
                  fi
                done
                paths=$(printf '%s\n' "${dirs[@]}")
              else
                paths=$(find docker -name Dockerfile)
              fi
              ;;
            pull_request)
              paths=$(git diff --name-only "$PR_BASE_SHA" HEAD -- docker)
              ;;
            *)
              paths=$(git diff --name-only "$PUSH_BEFORE_SHA" HEAD -- docker)
              ;;
          esac
          .github/scripts/plan.sh <<<"$paths" | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGES: ${{ inputs.images }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "_" separates fields because image names contain "-" (e.g. atcoder-csharp vs atcoder-csharp-aot)
          name: digests_${{ matrix.image }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.images) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests_${{ matrix.image }}_*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          cd "$RUNNER_TEMP/digests"
          count=$(find . -type f | wc -l)
          if [ "$count" -ne "$PLATFORM_COUNT" ]; then
            echo "::error::Expected $PLATFORM_COUNT digests for $IMAGE but found $count; skipping tag to avoid a partial multi-arch image"
            exit 1
          fi
          sources=()
          for digest in *; do
            sources+=("$REGISTRY/$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$SOURCE_URL" \
            --tag "$REGISTRY/$IMAGE:$TAG" \
            --tag "$REGISTRY/$IMAGE:$TAG-${GITHUB_SHA::7}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$REGISTRY/$IMAGE:$TAG"
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          PLATFORM_COUNT: ${{ matrix.platform_count }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
